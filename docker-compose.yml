version: "3.13"
services:
  db-payments:
    image: postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    env_file:
      - src/.env
    ports:
      - "5436:5432"
    networks:
      - mc_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  stripe:
    image: stripe/stripe-cli
    container_name: stripe
    volumes:
      - ./src:/app/src
    command: listen --forward-to http://web-payments:8500/webhook/
    networks:
      - mc_network

  web-payments:
    build: .
    command: /app/start.sh
    volumes:
      - ./src:/app/src
    ports:
      - "8500:8500"
    networks:
      - mc_network
    depends_on:
      db-visits:
        condition: service_healthy
      redis:
        condition: service_started
      celery-worker:
        condition: service_started

  redis:
    image: "redis:alpine"
    ports:
      - "6380:6380"
    networks:
      - mc_network

  celery-worker:
    build: .
    command: celery -A src.core worker --loglevel=info
    depends_on:
      - redis
    volumes:
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app/src
      - DJANGO_SETTINGS_MODULE=src.core.settings
    networks:
      - mc_network

networks:
  mc_network:
    external: true